server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify corre detras de su propio proxy: log a stdout/stderr.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;
    # Los .webp, .woff2 y .mp4 ya vienen comprimidos: no se recomprimen.

    # Landing de una sola pagina: cualquier ruta cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (los genera Vite): cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fuentes, imagenes y video: nombre estable, cache larga pero revalidable.
    location ~* \.(woff2|webp|png|jpg|jpeg|svg|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # El HTML nunca se cachea, para que un deploy se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
