server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Coolify corre detras de su propio proxy: log a stdout/stderr.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        application/manifest+json;
    # Los .webp, .woff2, .mp4 y .glb ya vienen comprimidos: no se recomprimen.

    # Cabeceras de seguridad. Un add_header dentro de un location REEMPLAZA a los del server, asi que
    # cada location de abajo que define el suyo (cache) vuelve a incluir este archivo.
    include /etc/nginx/conf.d/seguridad.inc;

    # /modelos/<slug>/ -> /modelos/<slug>: una sola URL por ficha (la que lleva el canonical).
    include /etc/nginx/conf.d/rutas.inc;
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/conf.d/seguridad.inc;
    }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        include /etc/nginx/conf.d/seguridad.inc;
    }

    # Cada ficha tiene su HTML con titulo, descripcion e imagen para compartir (lo escribe el build en
    # dist/modelos/<slug>.html): se sirve ese y, si no existe, index.html (la landing y /modelos).
    # Todo lo demas que no matchee abajo (robots, sitemap...) cae aca y revalida en cada visita.
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/conf.d/seguridad.inc;
    }

    # Assets con hash en el nombre (los genera Vite): cachean para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/seguridad.inc;
        access_log off;
    }

    # Visor 3D (modelo, decoder Draco y texturas): nombre estable, cache larga pero revalidable.
    location ^~ /3d/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/conf.d/seguridad.inc;
        access_log off;
    }

    # Fuentes, imagenes, video y PDF: nombre estable, cache larga pero revalidable.
    location ~* \.(woff2|webp|png|jpg|jpeg|svg|ico|mp4|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/conf.d/seguridad.inc;
        access_log off;
    }
}
